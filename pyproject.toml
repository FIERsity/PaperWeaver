[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "paperweaver"
version = "0.3.0"
description = "A file-first workspace for translated academic papers and source-grounded reading guides."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "PaperWeaver contributors" }]
keywords = ["academic papers", "translation", "reading guide", "agents"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
paperweaver = "paperweaver.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/paperweaver"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
