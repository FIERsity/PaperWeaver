[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "paperweaver"
version = "0.5.0"
description = "A file-first workspace for complete Chinese paper translations and evidence-backed summaries."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "PaperWeaver contributors" }]
keywords = ["academic papers", "translation", "reading guide", "agents"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = ["reportlab>=4.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pypdf>=5,<7"]
pdf = ["pdfplumber>=0.11,<0.12", "pypdfium2>=5,<6", "Pillow>=12,<13"]

[project.scripts]
paperweaver = "paperweaver.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/paperweaver"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "corpus: opt-in regression tests against checksum-pinned open papers in the local cache",
]

[tool.ruff]
line-length = 100
target-version = "py311"
