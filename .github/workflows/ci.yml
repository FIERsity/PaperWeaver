name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - run: ruff check .
  pdf:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,pdf]'
      - run: pytest tests/test_pdf_import.py

  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: tmp/corpus-cache
          key: corpus-${{ hashFiles('tests/corpus/pdf-jats-manifest.json') }}
      - run: python -m pip install -e '.[dev,pdf]'
      - name: Fetch checksum-pinned open papers
        run: >-
          python scripts/pdf_corpus.py fetch
          --id pone-0251194
          --id pcbi-1005331
          --id pcbi-1002377
          --id pcbi-1012374
          --id acl-tables-2024
          --id joss-04061
          --id layoutparser-2103-15348
      - name: Run real-paper regression slice
        run: >-
          python scripts/pdf_corpus.py run --jobs 2
          --id pone-0251194
          --id pcbi-1005331
          --id pcbi-1002377
          --id pcbi-1012374
          --id acl-tables-2024
          --id joss-04061
          --id layoutparser-2103-15348
      - uses: actions/upload-artifact@v4
        with:
          name: open-pdf-corpus-report
          path: tmp/corpus-runs/*/report.*
